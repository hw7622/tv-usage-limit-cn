<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1220">
<title>电视时间管家 · 手机配置</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ===== 登录 ===== -->
<div id="login" class="login">
  <div class="login-card">
    <div class="brand">电视时间管家</div>
    <p class="sub">输入电视上那个家长密码</p>
    <div class="dots" id="dots"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="fn">删除</button><button data-k="0">0</button><button data-k="ok" class="fn ok">进入</button>
    </div>
    <p class="err" id="loginErr"></p>
    <p class="hint">默认 1234，进「设置」页可以改。<br>改完请记好：忘了密码只能清掉电视上这个 App 的数据重来（历史记录会丢）。</p>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-l">
      <div class="dev" id="devName">电视时间管家</div>
      <div class="meta" id="devMeta">连接中…</div>
    </div>
    <button class="icon-btn" id="logoutBtn">退出</button>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="today">今日</button>
    <button class="tab" data-tab="usage">用量</button>
    <button class="tab" data-tab="limits">额度</button>
    <button class="tab" data-tab="schedule">作息</button>
    <button class="tab" data-tab="bank">题库</button>
    <button class="tab" data-tab="mistakes">错题</button>
    <button class="tab" data-tab="settings">设置</button>
  </div>

  <div class="panes">
    <section class="pane active" id="pane-today"></section>
    <section class="pane" id="pane-usage"></section>
    <section class="pane" id="pane-limits"></section>
    <section class="pane" id="pane-schedule"></section>
    <section class="pane" id="pane-bank"></section>
    <section class="pane" id="pane-mistakes"></section>
    <section class="pane" id="pane-settings"></section>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
